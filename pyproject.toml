[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repohunter"
version = "0.1.0"
description = "RepoHunter CLI for repository discovery, organization, and research"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "RepoHunter Team" }]
license = "MIT"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0.0",
  "SQLAlchemy>=2.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-PyYAML>=6.0.3",
]

[project.scripts]
repohunter = "repohunter.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]

testpaths = ["tests"]
